<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Dominant-operator families &mdash; disagreement-kind graph v1</title>
<style>
 body{margin:0;font:13px/1.4 system-ui,sans-serif;background:#14161a;
      color:#d7dae0;display:flex;flex-direction:column;height:100vh}
 #bar{padding:6px 12px;background:#1d2026;display:flex;
      gap:12px;align-items:center;flex-wrap:wrap;
      border-bottom:1px solid #2b2f36}
 #bar b{color:#fff}
 #bar i{color:#7d8590;font-style:italic}
 input[type=range]{width:120px;vertical-align:middle}
 #search{background:#14161a;border:1px solid #3a3f48;color:#d7dae0;
         padding:3px 7px;border-radius:4px;width:180px}
 select,button{background:#14161a;border:1px solid #3a3f48;color:#d7dae0;
        padding:2px 5px;border-radius:4px}
 button{cursor:pointer}
 button.hot{border-color:#e0b83e;color:#e0b83e}
 #stats{color:#9aa2ad}
 #rule{color:#7d8590;font-size:11px;padding:3px 12px;background:#191c21;
       border-bottom:1px solid #2b2f36}
 #stage{flex:1;display:flex;min-height:0;position:relative}
 #panel{width:330px;overflow:auto;background:#191c21;
        border-right:1px solid #2b2f36;padding:8px 10px;font-size:11.5px}
 #panel h3{font-size:12px;margin:10px 0 4px;color:#fff}
 #panel .c{padding:4px 6px;margin:2px 0;border:1px solid #2b2f36;
           border-radius:4px;cursor:pointer;background:#1d2026}
 #panel .c:hover{border-color:#6fb0e0}
 #panel .span{border-left:3px solid #e6553f}
 #panel .sel{border-color:#fff}
 #panel .k{color:#9aa2ad}
 #panel .m{color:#e6553f}
 #wrap{flex:1;position:relative;min-width:0}
 canvas{display:block;width:100%;height:100%}
 #tip{position:absolute;pointer-events:none;background:#22262d;
      border:1px solid #3a3f48;border-radius:5px;padding:6px 9px;
      display:none;max-width:560px;z-index:9;font-size:12px}
 label{cursor:pointer;white-space:nowrap}
</style></head><body>
<div id="bar">
 <b>Dominant-operator families</b>
 <span>gate block <select id="bsel"></select></span>
 <span>kinds
  <label><input type="checkbox" id="kW" checked> WINDOW-only</label>
  <label><input type="checkbox" id="kV" checked> VALUE-only</label>
  <label><input type="checkbox" id="kM"> MIXED</label>
  <label><input type="checkbox" id="kD" checked> DECLINE-KIND</label>
  <label><input type="checkbox" id="kR"> refused WINDOW pairs</label>
 </span>
 <span>min disagreeing cells
  <input type="range" id="mind" min="0" max="100" value="0">
  <span id="mindv">0</span></span>
 <label><input type="checkbox" id="showint"> member sub-nodes</label>
 <span>colour <select id="cmode">
  <option value="mode">by named mode</option>
  <option value="wcomp">by WINDOW-only component</option>
  <option value="form">by output form signature</option>
  <option value="members">by member count</option>
  <option value="spell">by spelling</option></select></span>
 <span>highlight <select id="hl">
  <option value="none">nothing</option>
  <option value="wcomp">WINDOW-only components</option>
  <option value="span">MODE-SPANNING WINDOW-only components only</option>
  </select></span>
 <span>draw cap <select id="cap">
  <option value="2000">2000</option>
  <option value="10000">10000</option>
  <option value="40000" selected>40000</option>
  <option value="9999999">no cap</option></select></span>
 <input id="search" placeholder="search family / member / spelling">
 <button id="w16">&sect;1.6 chain</button>
 <button id="w15">&sect;1.5 witness</button>
 <button id="fitbtn">fit view</button>
 <span id="stats"></span>
</div>
<div id="rule"></div>
<div id="stage">
 <div id="panel"></div>
 <div id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
</div>
<script>
const G=__DATA__;
// ------------------------------------------------------------------
// NOTHING STRUCTURAL IS DECIDED HERE.  The nodes are the IDENTITY
// (CONTRACT) families of log_070 -- profiles with byte-identical
// full-grid vectors, plain equality, transitive, no clique test.  The
// connectors are the disagreement kinds the owner ruled on 2026-08-23
// (log_069).  The "min disagreeing cells" slider is a VIEW filter, not
// a ruled threshold, and it cuts EXTERNAL connectors ONLY.
// VOCABULARY (absolute): super-node / sub-node / co-node / sub-tree;
// the OS-stopped outcome is ABORT.
// ------------------------------------------------------------------
const BLK={};G.blocks.forEach(b=>{BLK[b.block]=b;});
const BNAMES=G.blocks.map(b=>b.block);
const KIND={
 WINDOW:{c:"#4f9cf0",d:[],lab:"WINDOW-only",
   say:"one side declines where the other answers, never a value clash "+
       "-- same behaviour, narrower holder"},
 VALUE:{c:"#e6553f",d:[11,5],lab:"VALUE-only",
   say:"both answer, values differ -- a real mode boundary"},
 MIXED:{c:"#b57ee0",d:[2,5],lab:"MIXED",
   say:"both kinds present -- needs the region test"},
 DECLINE:{c:"#e0b83e",d:[10,3,2,3],lab:"DECLINE-KIND",
   say:"both sides declined, with DIFFERENT declines -- the fourth kind "+
       "the ruled classifier has no bucket for (standing rulings 1.5)"},
 REFUSED:{c:"#3d6f9e",d:[1,6],lab:"refused WINDOW pair",
   say:"WINDOW-only with ZERO comparable value cells -- the settled "+
       "decline rule says NO connector, so it is never counted and "+
       "never carries the layout"}};
const PAL=["#e6553f","#4f9cf0","#58c26a","#e0b83e","#b57ee0","#3ec8c0",
 "#e07ab0","#98a832","#f08b3e","#7a8cf0","#50b08a","#c0625a",
 "#d0a05a","#6fb0e0","#9ad04a","#e05a8a","#5ad0b0","#a07ae0"];
const GREY="#5a6270",DGREY="#3f4650";
const $=s=>document.getElementById(s);
const cv=$("cv"),ctx=cv.getContext("2d"),tip=$("tip"),bsel=$("bsel"),
 kW=$("kW"),kV=$("kV"),kM=$("kM"),kD=$("kD"),kR=$("kR"),mind=$("mind"),
 mindv=$("mindv"),showint=$("showint"),cmode=$("cmode"),hl=$("hl"),
 cap=$("cap"),search=$("search"),stats=$("stats"),rule=$("rule"),
 panel=$("panel");
BNAMES.forEach(b=>{bsel.innerHTML+="<option value=\""+b+"\""+
 (b===G.default_block?" selected":"")+">"+b+" ("+BLK[b].n_families+
 " families)</option>";});
bsel.value=G.default_block;

// ---- per-block model ------------------------------------------------
let B=null,FN=[],MN=[],LN=[],INT=[],EXT=[],WKEEP=[],mcolor={},
 spcolor={},fmcolor={},MAXND=1;
let T=0,KW=true,KV=true,KM=false,KD=true,KR=false,SI=false,CM="mode",
 HL="none",CAP=40000,q="",act=[],actDraw=[],actRef=[],actInt=[],pass=[],
 hover=null,hoverE=null,drag=null,sel=new Set(),chain=null,note="",
 spanSet=new Set();
let ox=0,oy=0,scale=1,heat=1,userMoved=false,fitted=false;
let wcomp=[],wcompSize=new Map(),wcompN=0,wcompMulti=0,wcompMax=0;

function build(name){
 B=BLK[name];
 const F=B.families;
 FN=F.map((f,i)=>({t:"fam",i:i,f:f,x:0,y:0,vx:0,vy:0}));
 MN=[];INT=[];
 F.forEach((f,i)=>{f.members.forEach(m=>{
  const k=MN.length;
  MN.push({t:"mem",fi:i,label:m,x:0,y:0,vx:0,vy:0});
  INT.push({ai:k,bi:i});});});
 // colours
 const modes=[...new Set(F.map(f=>f.name))].sort();
 mcolor={};let mi=0;
 modes.forEach(m=>{mcolor[m]=(m==="UNCLASSIFIED")?GREY:
  ((m==="NON-DISCRIMINATING")?DGREY:PAL[(mi++)%PAL.length]);});
 const sps=[...new Set(F.map(f=>f.spellings.join("+")))].sort();
 spcolor={};sps.forEach((s,i)=>{spcolor[s]=PAL[i%PAL.length];});
 const fms=[...new Set(F.map(f=>f.output_form_signature.join("|")))].sort();
 fmcolor={};fms.forEach((s,i)=>{fmcolor[s]=PAL[(i*5)%PAL.length];});
 // external connectors, every kind in one array
 EXT=[];WKEEP=[];MAXND=1;
 const push=(slot,kind)=>{const t=B.edges[slot];
  for(let n=0;n<t.a.length;n++){
   const e={ai:t.a[n],bi:t.b[n],kind:kind,nd:t.nd[n],vv:t.vv[n],
            wi:t.wi[n],tt:t.tt[n],cmp:t.cmp[n],_o:EXT.length};
   if(e.nd>MAXND)MAXND=e.nd;
   EXT.push(e);if(kind==="WINDOW")WKEEP.push(e);}};
 push("WINDOW","WINDOW");push("VALUE","VALUE");push("DECLINE","DECLINE");
 {const t=B.mixed;
  for(let n=0;n<t.a.length;n++){
   const e={ai:t.a[n],bi:t.b[n],kind:"MIXED",nd:t.nd[n],vv:null,
            wi:null,tt:null,cmp:null,_o:EXT.length};
   if(e.nd>MAXND)MAXND=e.nd;EXT.push(e);}}
 // refused WINDOW-only pairs: kept in the data so the count is
 // auditable, but they are NOT connectors -- never counted, never
 // fed to the layout
 actRefAll=[];
 {const t=B.edges.WINDOW_REFUSED;
  for(let n=0;n<t.a.length;n++)
   actRefAll.push({ai:t.a[n],bi:t.b[n],kind:"REFUSED",nd:t.nd[n],
    vv:t.vv[n],wi:t.wi[n],tt:t.tt[n],cmp:t.cmp[n]});}
 mind.max=String(MAXND);
 // seed positions: one ring per named mode, so a component that spans
 // modes is visible as a blob crossing ring colours
 const ring={};let ri=0;
 modes.forEach(m=>{const t=6.283*(ri++)/modes.length;
  ring[m]=[Math.cos(t)*1400,Math.sin(t)*1400];});
 const cnt={};
 FN.forEach(n=>{const c=ring[n.f.name];
  const k=(cnt[n.f.name]=(cnt[n.f.name]||0)+1);
  const t=6.283*k/23;
  n.x=c[0]+Math.cos(t)*(70+5*k);n.y=c[1]+Math.sin(t)*(70+5*k);});
 MN.forEach(n=>{const p=FN[n.fi];
  n.x=p.x+(Math.random()-0.5)*40;n.y=p.y+(Math.random()-0.5)*40;});
 sel=new Set();chain=null;note="";
 heat=1;userMoved=false;fitted=false;
}
let actRefAll=[];

function uf(pairs){
 const p=new Int32Array(FN.length);
 for(let i=0;i<FN.length;i++)p[i]=i;
 const f=x=>{while(p[x]!==x){p[x]=p[p[x]];x=p[x];}return x;};
 for(const e of pairs){const a=f(e.ai),b=f(e.bi);if(a!==b)p[a]=b;}
 const lab=new Int32Array(FN.length);
 for(let i=0;i<FN.length;i++)lab[i]=f(i);
 const size=new Map();
 for(let i=0;i<FN.length;i++)size.set(lab[i],(size.get(lab[i])||0)+1);
 let multi=0,mx=0;
 for(const v of size.values()){if(v>1)multi++;if(v>mx)mx=v;}
 return {lab:lab,comps:size.size,multi:multi,max:mx,size:size};
}

function refresh(){
 T=+mind.value;mindv.textContent=String(T);
 KW=kW.checked;KV=kV.checked;KM=kM.checked;KD=kD.checked;KR=kR.checked;
 SI=showint.checked;CM=cmode.value;HL=hl.value;CAP=+cap.value;
 q=search.value.trim().toLowerCase();
 const on={WINDOW:KW,VALUE:KV,MIXED:KM,DECLINE:KD};
 // the kind toggles and the slider cut EXTERNAL connectors ONLY
 pass=EXT.filter(e=>on[e.kind]&&e.nd>=T);
 const capped=pass.length>CAP;
 act=capped?pass.slice(0,CAP):pass;
 // MIXED sits underneath so the three rare kinds stay readable on top
 const order={MIXED:0,WINDOW:1,VALUE:2,DECLINE:3};
 actDraw=act.slice().sort((p,r)=>order[p.kind]-order[r.kind]);
 actRef=KR?actRefAll.filter(e=>e.nd>=T):[];
 actInt=SI?INT:[];
 LN=SI?FN.concat(MN):FN;
 // components on the ACTIVE external connectors only -- the full
 // passing set, never the drawn-and-capped subset
 const u=uf(pass);
 // the 1.6 reading: components on WINDOW-only connectors alone,
 // decline rule already applied, independent of what is drawn
 const w=uf(WKEEP.filter(e=>e.nd>=T));
 wcomp=w.lab;wcompN=w.comps;wcompMulti=w.multi;wcompMax=w.max;
 wcompSize=w.size;
 spanSet=new Set();
 B.component_detail.forEach(c=>{if(c.spans_modes)
  c.members.forEach(x=>spanSet.add(x));});
 stats.textContent=B.n_families+" families ("+B.n_profiles+
  " profiles) | "+act.length+" of "+pass.length+" connectors drawn"+
  (capped?" [CAP]":"")+" | "+actRef.length+" refused shown | "+
  actInt.length+" internal | components on the active set: "+u.comps+
  " ("+u.multi+" multi-node, largest "+u.max+")";
 const kc=B.kind_counts;
 rule.textContent="NODES = the "+B.n_families+" IDENTITY (CONTRACT) "+
  "families of this gate block -- profiles with byte-identical "+
  "full-grid vectors; equality is transitive, so no clique test. "+
  "CONNECTORS = the ruled disagreement kinds over ALL "+B.pairs+
  " pairs of this block: WINDOW-only "+kc.WINDOW+" ("+
  B.window_edges_kept+" are connectors, "+B.window_edges_refused+
  " refused by the settled decline rule -- zero comparable keys means "+
  "NO connector), VALUE-only "+kc.VALUE+", MIXED "+kc.MIXED+
  ", DECLINE-KIND "+kc.DECLINE_KIND+".  Kinds differ by COLOUR AND BY "+
  "DASH.  The kind toggles and the slider cut EXTERNAL connectors "+
  "only; internal connectors tether a member to its family node with a "+
  "near-zero spring ("+G.int_spring+" against "+G.ext_spring+
  ") and are never cut and never counted; COMPONENTS ARE COUNTED ON "+
  "EXTERNAL CONNECTORS ONLY.  "+(capped
   ?("DRAW CAP IN FORCE: "+pass.length+" connectors pass, the first "+
     CAP+" in kind order are DRAWN, "+(pass.length-CAP)+" are not -- "+
     "the counts above and every component count are computed on all "+
     pass.length+", not on the drawn subset.")
   :("all "+pass.length+" passing connectors are drawn (cap "+
     (CAP>=9999999?"off":CAP)+").")) +
  "  Nothing structural is decided here: the slider is a view filter, "+
  "not a ruled threshold, and no name is coined.";
 heat=Math.max(heat,0.25);
 drawPanel();
}

function esc(s){return String(s).replace(/&/g,"&amp;")
 .replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function drawPanel(){
 const r=B;
 let h="<h3>&sect;1.6 &mdash; the two readings for "+esc(r.block)+"</h3>"+
  "<div class=k>Both measured, NEITHER chosen. The identity families "+
  "underneath are unaffected either way.</div>"+
  "<table><tr><td>by connected component</td><td><b>"+r.components+
  "</b> groups</td></tr>"+
  "<tr><td class=k>&nbsp;&nbsp;multi-node / largest</td><td>"+
  r.components_multi+" / "+r.largest_component+"</td></tr>"+
  "<tr><td class=k>&nbsp;&nbsp;not a clique</td><td>"+
  r.components_not_cliques+"</td></tr>"+
  "<tr><td>by maximal clique</td><td><b>"+r.maximal_cliques+
  "</b> groups</td></tr></table>"+
  "<div class=k>A component is a partition; a maximal-clique cover is "+
  "not. Live count with the current slider: <b>"+wcompN+"</b> "+
  "components, largest "+wcompMax+".</div>";
 if(note)h+="<h3>selected</h3><div>"+note+"</div>";
 h+="<h3>WINDOW-only components ("+r.components_multi+" multi-node, "+
  r.mode_spanning_components+" span more than one census name)</h3>";
 r.component_detail.forEach((c,ci)=>{
  const isSel=sel.size&&c.members.every(x=>sel.has(x))&&
   sel.size===c.members.length;
  h+="<div class=\"c"+(c.spans_modes?" span":"")+(isSel?" sel":"")+
   "\" data-ci=\""+ci+"\">"+c.size+" families / "+c.n_profiles+
   " profiles &middot; "+(c.is_clique?"a clique":"NOT a clique")+"<br>"+
   (c.spans_modes?"<span class=m>SPANS MODES: ":"<span class=k>names: ")+
   esc(c.census_names.length?c.census_names.join(" + "):
       c.names.join(" + "))+"</span><br><span class=k>"+
   esc(c.spellings.join(" "))+"</span></div>";});
 panel.innerHTML=h;
}
panel.onclick=ev=>{
 let t=ev.target;
 while(t&&!(t.dataset&&t.dataset.ci!==undefined))t=t.parentNode;
 if(!t)return;
 const c=B.component_detail[+t.dataset.ci];
 sel=new Set(c.members);chain=null;
 note="component of "+c.size+" families / "+c.n_profiles+" profiles"+
  (c.spans_modes?"<br><span class=m>this ONE WINDOW-only component "+
   "spans the census names "+esc(c.census_names.join(" + "))+
   "</span>":"")+
  "<br><span class=k>names present: "+esc(c.names.join(" + "))+
  "</span>";
 drawPanel();fit(sel);
};

// ---- the two rulings, findable by one click -------------------------
function goto16(){
 const w=G.witness_1_6;
 if(bsel.value!==w.block){bsel.value=w.block;build(w.block);}
 kW.checked=true;kV.checked=true;kD.checked=true;
 hl.value="span";cmode.value="mode";mind.value="0";
 const ids=w.families.map(f=>f.i);
 sel=new Set(ids);chain={a:ids[0],m:ids[1],b:ids[2]};
 note="<b>&sect;1.6 &mdash; the measured counterexample</b><br>"+
  "hop 1 &nbsp;"+esc(w.families[0].member)+" ("+esc(w.families[0].name)+
  ")<br>&nbsp;&nbsp;&harr; "+esc(w.families[1].member)+" ("+
  esc(w.families[1].name)+") &mdash; WINDOW-only, "+w.hop1.wi+
  " window cells over "+w.hop1.comparable+" comparable<br>"+
  "hop 2 &nbsp;&harr; "+esc(w.families[2].member)+" ("+
  esc(w.families[2].name)+") &mdash; WINDOW-only, "+w.hop2.wi+
  " window cells over "+w.hop2.comparable+" comparable<br>"+
  "<span class=m>compared DIRECTLY the two ends are "+w.direct.kind+
  "-only at "+w.direct.vv+" value cells over "+w.direct.comparable+
  " comparable &mdash; DIFFERENT modes</span><br>"+
  "the component they fall in holds "+w.component_size+" families / "+
  w.component_profiles+" profiles and carries the census names "+
  esc(w.component_census_names.join(" + "))+
  "<br><span class=k>the middle family, "+esc(w.families[1].member)+
  ", is NON-DISCRIMINATING: its holder never reaches its own fracture "+
  "inside the X set</span>";
 refresh();fit(sel);
}
function goto15(){
 const w=G.witness_1_5;
 if(bsel.value!==w.block){bsel.value=w.block;build(w.block);}
 kD.checked=true;mind.value="0";
 sel=new Set([w.ai,w.bi]);chain={a:w.ai,m:null,b:w.bi};
 note="<b>&sect;1.5 &mdash; the fourth disagreement kind</b><br>"+
  esc(w.a)+"<br>&harr; "+esc(w.b)+"<br>DECLINE-KIND only: "+
  w.edge.tt+" cells where both declined with DIFFERENT declines, "+
  w.edge.vv+" value clashes, "+w.edge.wi+" window cells, over "+
  w.edge.comparable+" comparable cells<br><span class=k>"+
  G.totals.DECLINE_KIND+" such pairs across all eighteen gate blocks; "+
  B.kind_counts.DECLINE_KIND+" in this one</span>";
 refresh();fit(sel);
}
$("w16").onclick=goto16;
$("w15").onclick=goto15;

bsel.onchange=()=>{build(bsel.value);refresh();};
[mind].forEach(e=>{e.oninput=refresh;});
[kW,kV,kM,kD,kR,showint,cmode,hl,cap].forEach(e=>{e.onchange=refresh;});
search.oninput=refresh;
build(bsel.value);refresh();

function size(){const r=cv.getBoundingClientRect();
 cv.width=Math.max(320,Math.round(r.width));
 cv.height=Math.max(240,Math.round(r.height));}
addEventListener("resize",size);size();

// ---- layout ---------------------------------------------------------
const CELL=170,INT_K=G.int_spring,EXT_K=G.ext_spring;
function step(){
 if(heat>0.01){
  const grid=new Map();
  for(let i=0;i<LN.length;i++){
   const n=LN[i];
   const k=((n.x/CELL)|0)+","+((n.y/CELL)|0);
   let b=grid.get(k);if(!b){b=[];grid.set(k,b);}b.push(n);}
  for(const [k,b] of grid){
   const p=k.split(","),gx=+p[0],gy=+p[1];
   for(let dx=0;dx<=1;dx++)for(let dy=(dx?-1:0);dy<=1;dy++){
    const o=grid.get((gx+dx)+","+(gy+dy));if(!o)continue;
    const same=(dx===0&&dy===0);
    for(let x=0;x<b.length;x++)for(let y=same?x+1:0;y<o.length;y++){
     const a=b[x],c=o[y];if(a===c)continue;
     let ddx=a.x-c.x,ddy=a.y-c.y;let d2=ddx*ddx+ddy*ddy;
     if(d2<1)d2=1;if(d2>90000)continue;
     const d=Math.sqrt(d2),f=Math.min(2600/d2,5);
     a.vx+=ddx/d*f;a.vy+=ddy/d*f;c.vx-=ddx/d*f;c.vy-=ddy/d*f;}}}
  // NEAR-ZERO internal spring: a visual tether from a member sub-node
  // to its family node, never the layout
  actInt.forEach(e=>{const a=MN[e.ai],b=FN[e.bi];
   let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy);if(d<1)d=1;
   const f=Math.min((d-40)*INT_K,6);
   a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;});
  // EXTERNAL connectors carry the layout
  act.forEach(e=>{const a=FN[e.ai],b=FN[e.bi];
   let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy);if(d<1)d=1;
   const f=Math.min((d-150)*EXT_K,6);
   a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;});
  LN.forEach(n=>{
   n.vx-=n.x*0.004;n.vy-=n.y*0.004;
   const v=Math.hypot(n.vx,n.vy);
   if(v>30){n.vx*=30/v;n.vy*=30/v;}
   n.x+=n.vx*0.25*heat;n.y+=n.vy*0.25*heat;n.vx*=0.75;n.vy*=0.75;
   const r=Math.hypot(n.x,n.y);
   if(r>2900){n.x*=2900/r;n.y*=2900/r;}});
  heat*=0.992;}
 draw();requestAnimationFrame(step);}

function fit(only){
 const set=(only&&only.size)?FN.filter(n=>only.has(n.i)):LN;
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
 set.forEach(n=>{mnx=Math.min(mnx,n.x);mxx=Math.max(mxx,n.x);
  mny=Math.min(mny,n.y);mxy=Math.max(mxy,n.y);});
 const w2=Math.max(mxx-mnx,10),h2=Math.max(mxy-mny,10);
 scale=Math.min((cv.width-90)/w2,(cv.height-90)/h2,3);
 ox=-(mnx+mxx)/2;oy=-(mny+mxy)/2;}
// AUTOFIT RUNS ONCE THEN NEVER AGAIN.  Any wheel or mousedown disables
// it permanently.  The "fit view" button is the only way back.
function autofit(){if(userMoved||fitted)return;if(heat<0.35){fit();
 fitted=true;}}
const _af=setInterval(()=>{autofit();if(fitted||userMoved)
 clearInterval(_af);},800);
addEventListener("wheel",()=>{userMoved=true;},{passive:true});
addEventListener("mousedown",()=>{userMoved=true;});
$("fitbtn").onclick=()=>{fit(sel);};

// ---- drawing --------------------------------------------------------
function sx(x){return cv.width/2+(x+ox)*scale;}
function sy(y){return cv.height/2+(y+oy)*scale;}
function hit(n){if(!q)return false;
 if(n.t==="mem")return n.label.toLowerCase().includes(q);
 const f=n.f;
 return f.id.toLowerCase().includes(q)||
  f.name.toLowerCase().includes(q)||
  f.members.join(" ").toLowerCase().includes(q)||
  f.spellings.join(" ").toLowerCase().includes(q)||
  f.languages.join(" ").toLowerCase().includes(q);}
function mbin(f){const m=f.n_profiles;
 return m<=1?"1":(m<=3?"2-3":(m<=7?"4-7":"8+"));}
const mbc={"1":"#4f9cf0","2-3":"#58c26a","4-7":"#e0b83e","8+":"#e6553f"};
function color(n){
 const f=n.f;
 if(CM==="wcomp"){const r=wcomp[n.i];
  return (wcompSize.get(r)||1)>1?PAL[Math.abs(r*7)%PAL.length]:DGREY;}
 if(CM==="form")return fmcolor[f.output_form_signature.join("|")];
 if(CM==="members")return mbc[mbin(f)];
 if(CM==="spell")return spcolor[f.spellings.join("+")];
 return mcolor[f.name];}
function dim(n){
 if(q&&!hit(n))return true;
 if(HL==="span")return !spanSet.has(n.i);
 if(HL==="wcomp")return (wcompSize.get(wcomp[n.i])||1)<=1;
 return false;}
function rgba(hex,a){
 const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),
  b=parseInt(hex.slice(5,7),16);
 return "rgba("+r+","+g+","+b+","+a+")";}
function drawEdges(list,alpha){
 let cur=null;
 for(const e of list){
  if(e.kind!==cur){cur=e.kind;ctx.setLineDash(KIND[cur].d);
   ctx.strokeStyle=rgba(KIND[cur].c,alpha);}
  const a=FN[e.ai],b=FN[e.bi];
  if(e===hoverE)ctx.strokeStyle="#ffffff";
  ctx.beginPath();ctx.moveTo(sx(a.x),sy(a.y));
  ctx.lineTo(sx(b.x),sy(b.y));ctx.stroke();
  if(e===hoverE)ctx.strokeStyle=rgba(KIND[cur].c,alpha);}
 ctx.setLineDash([]);}
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);
 ctx.lineWidth=1;
 if(actRef.length)drawEdges(actRef,0.10);
 drawEdges(actDraw,act.length>20000?0.05:(act.length>4000?0.13:0.35));
 if(actInt.length){ctx.setLineDash([3,3]);
  ctx.strokeStyle="rgba(224,184,62,0.14)";
  actInt.forEach(e=>{const a=MN[e.ai],b=FN[e.bi];
   ctx.beginPath();ctx.moveTo(sx(a.x),sy(a.y));
   ctx.lineTo(sx(b.x),sy(b.y));ctx.stroke();});
  ctx.setLineDash([]);}
 if(chain){
  ctx.lineWidth=3;
  const seg=(a,b,col,d)=>{ctx.setLineDash(d);ctx.strokeStyle=col;
   ctx.beginPath();ctx.moveTo(sx(FN[a].x),sy(FN[a].y));
   ctx.lineTo(sx(FN[b].x),sy(FN[b].y));ctx.stroke();};
  if(chain.m!==null&&chain.m!==undefined){
   seg(chain.a,chain.m,"#7fd0ff",[]);
   seg(chain.m,chain.b,"#7fd0ff",[]);
   seg(chain.a,chain.b,"#ff7a5f",[11,5]);}
  else seg(chain.a,chain.b,"#e0b83e",[10,3,2,3]);
  ctx.setLineDash([]);ctx.lineWidth=1;}
 if(SI){MN.forEach(n=>{
   ctx.beginPath();ctx.arc(sx(n.x),sy(n.y),2,0,6.283);
   ctx.fillStyle="rgba(160,170,185,0.5)";ctx.fill();});}
 FN.forEach(n=>{
  const h=hit(n),d=dim(n),f=n.f;
  const r=(h?8:(n===hover?7:(2.5+Math.min(6,Math.log2(f.n_profiles+1)))));
  ctx.beginPath();ctx.arc(sx(n.x),sy(n.y),r,0,6.283);
  ctx.fillStyle=color(n);ctx.globalAlpha=d?0.10:1;
  ctx.fill();
  if(sel.has(n.i)){ctx.strokeStyle="#ffffff";ctx.lineWidth=2.5;
   ctx.stroke();ctx.lineWidth=1;}
  else if(f.census_name){ctx.strokeStyle="#cfd6e0";ctx.stroke();}
  ctx.globalAlpha=1;});
 ctx.font="11px sans-serif";
 if(scale>1.0||q||sel.size){ctx.fillStyle="#c8ceda";
  FN.forEach(n=>{if(q&&!hit(n))return;
   if(!q&&!sel.has(n.i)&&scale<=1.0)return;
   if(!q&&sel.size&&!sel.has(n.i))return;
   ctx.fillText(n.f.members[0]+(n.f.n_profiles>1?
    (" +"+(n.f.n_profiles-1)):""),sx(n.x)+7,sy(n.y)+3);});}
 legend();}
function legend(){
 let ly=cv.height-10;
 ctx.font="11px sans-serif";
 ctx.fillStyle="#7d8590";
 ctx.fillText("kinds differ by COLOUR AND DASH -- readable without "+
  "colour.  solid thin = internal tether (near-zero spring, never cut, "+
  "never counted)",10,ly-38);
 let lx=10;
 const ks=["WINDOW","VALUE","MIXED","DECLINE"].concat(KR?["REFUSED"]:[]);
 ks.forEach(k=>{const s=KIND[k];
  ctx.strokeStyle=s.c;ctx.setLineDash(s.d);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(lx,ly-22);ctx.lineTo(lx+34,ly-22);
  ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
  ctx.fillStyle="#9aa2ad";ctx.fillText(s.lab,lx+39,ly-19);
  lx+=48+ctx.measureText(s.lab).width;});
 lx=10;
 if(CM==="mode"){
  const modes=Object.keys(mcolor).sort();
  modes.forEach(m=>{ctx.fillStyle=mcolor[m];ctx.fillRect(lx,ly-8,8,8);
   ctx.fillStyle="#9aa2ad";ctx.fillText(m,lx+11,ly);
   lx+=20+ctx.measureText(m).width;
   if(lx>cv.width-160){lx=10;ly+=0;}});}
 else{ctx.fillStyle="#9aa2ad";
  ctx.fillText("colour: "+CM,10,ly);}}

// ---- picking and tips -----------------------------------------------
function pick(mx,my){hover=null;hoverE=null;
 for(const n of LN){
  const dx=sx(n.x)-mx,dy=sy(n.y)-my;
  if(dx*dx+dy*dy<64){hover=n;return;}}
 let best=25;
 for(const e of act){const a=FN[e.ai],b=FN[e.bi];
  const x1=sx(a.x),y1=sy(a.y),x2=sx(b.x),y2=sy(b.y);
  const L2=(x2-x1)*(x2-x1)+(y2-y1)*(y2-y1);if(!L2)continue;
  let t=((mx-x1)*(x2-x1)+(my-y1)*(y2-y1))/L2;
  t=Math.max(0,Math.min(1,t));
  const dx=mx-(x1+t*(x2-x1)),dy=my-(y1+t*(y2-y1)),d2=dx*dx+dy*dy;
  if(d2<best){best=d2;hoverE=e;}}}
function nodeTip(n){
 if(n.t==="mem")
  return "<b>"+esc(n.label)+"</b><br>a MEMBER profile of family "+
   esc(FN[n.fi].f.id)+"<br><i>tethered by an internal connector with a "+
   "near-zero spring; never cut, never counted</i>";
 const f=n.f,r=wcomp[n.i],cs=wcompSize.get(r)||1;
 return "<b>"+esc(f.id)+"</b> &middot; IDENTITY family &middot; <b>"+
  f.n_profiles+" member profile"+(f.n_profiles===1?"":"s")+"</b>"+
  "<br>gate block "+esc(f.id.split("#")[0])+" &middot; named mode <b>"+
  esc(f.name)+"</b>"+
  (f.consistent_with&&f.consistent_with.length
   ?(" <span>(consistent with "+esc(f.consistent_with.join(", "))+
     ")</span>"):"")+
  "<br>spellings "+esc(f.spellings.join(" "))+" &middot; languages "+
  esc(f.languages.join(", "))+
  "<br>output form signature "+esc(f.output_form_signature.join("|"))+
  "<br>full grid "+f.n_cells+" cells &middot; value "+f.n_value_cells+
  " &middot; declines "+f.n_declines+" &middot; UNREPRESENTABLE "+
  f.n_unrepresentable+
  "<br>WINDOW-only component: "+cs+" famil"+(cs===1?"y":"ies")+
  "<br><i>member profiles (identity: identical full grid)</i><br>&nbsp;&nbsp;"+
  f.member_windows.slice(0,16).map(esc).join("<br>&nbsp;&nbsp;")+
  (f.member_windows.length>16?("<br>&nbsp;&nbsp;&hellip; and "+
   (f.member_windows.length-16)+" more"):"");}
function edgeTip(e){
 const s=KIND[e.kind];
 return "<b>"+s.lab+"</b> connector<br><i>"+s.say+"</i><br>"+
  esc(FN[e.ai].f.members[0])+"<br>&harr; "+esc(FN[e.bi].f.members[0])+
  "<br>"+esc(FN[e.ai].f.id)+" ("+esc(FN[e.ai].f.name)+") &harr; "+
  esc(FN[e.bi].f.id)+" ("+esc(FN[e.bi].f.name)+")"+
  "<br>disagreeing cells "+e.nd+
  (e.vv===null?" <i>(per-cell split not embedded for MIXED &mdash; see "+
   "the log for the rendering-cap decision)</i>"
   :(" &middot; value clashes "+e.vv+" &middot; window "+e.wi+
     " &middot; decline-vs-different-decline "+e.tt+
     " &middot; comparable value cells "+e.cmp));}
function mxy(ev){const r=cv.getBoundingClientRect();
 return [ev.clientX-r.left,ev.clientY-r.top];}
cv.onmousemove=ev=>{const p=mxy(ev);
 if(drag){if(drag.node){drag.node.x=(p[0]-cv.width/2)/scale-ox;
   drag.node.y=(p[1]-cv.height/2)/scale-oy;heat=Math.max(heat,0.3);}
  else{ox+=(p[0]-drag.px)/scale;oy+=(p[1]-drag.py)/scale;
   drag.px=p[0];drag.py=p[1];}return;}
 pick(p[0],p[1]);
 if(hover){tip.style.display="block";tip.innerHTML=nodeTip(hover);}
 else if(hoverE){tip.style.display="block";tip.innerHTML=edgeTip(hoverE);}
 else tip.style.display="none";
 tip.style.left=(p[0]+16)+"px";tip.style.top=(p[1]+16)+"px";};
cv.onmousedown=ev=>{const p=mxy(ev);pick(p[0],p[1]);
 if(hover&&hover.t==="fam"){
  if(sel.has(hover.i))sel.delete(hover.i);else sel.add(hover.i);
  note="";chain=null;drawPanel();}
 drag=hover?{node:hover}:{px:p[0],py:p[1]};};
addEventListener("mouseup",()=>{drag=null;});
cv.onwheel=ev=>{ev.preventDefault();
 scale*=ev.deltaY<0?1.1:0.9;scale=Math.max(0.05,Math.min(8,scale));};
step();
</script></body></html>
